name: CI

# on itself is a trigger for the workflow. In this case,
# the workflow will run on any push or pull request to the main branch. You can customize this to fit your needs.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The permissions key defines the default permissions for the GITHUB_TOKEN used in the workflow. In this case, it is set to read-only access for repository contents.
#You can read my repository code, but you cannot modify or delete it using this permission.
permissions:
  contents: read

#jobs define the individual tasks that will be executed as part of the workflow.
# Each job runs in its own virtual environment and can have multiple steps.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify


        #uses is predefined action that can be used to perform common tasks in a workflow. In this case, it is used to check out the repository and set up Node.js.
        #run is used to execute shell commands in the workflow. In this case, it is used to install dependencies and run the verification script.